name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify tag matches package.json and manifest versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(jq -r .version manifest.json)
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Version mismatch: tag=$TAG package.json=$PKG manifest=$MANIFEST"
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Verify before releasing
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Pack MCPB bundle and verify contents against allowlist
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . planhat-mcp.mcpb
          actual=$(unzip -Z1 planhat-mcp.mcpb | sort)
          expected=$(printf 'LICENSE\nREADME.md\nassets/icon.png\ndist/server.js\nmanifest.json\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Bundle contents drifted from the allowlist"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Create checksum
        run: sha256sum planhat-mcp.mcpb > planhat-mcp.mcpb.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            planhat-mcp.mcpb
            planhat-mcp.mcpb.sha256
      - name: Generate MCP Registry metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/planhat-mcp.mcpb"
          BUNDLE_SHA=$(sha256sum planhat-mcp.mcpb | cut -d ' ' -f1)
          jq \
            --arg version "$VERSION" \
            --arg url "$BUNDLE_URL" \
            --arg sha "$BUNDLE_SHA" \
            '.version = $version | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            registry/server.template.json > server.json
      - name: Install MCP Registry publisher
        run: |
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt
          grep 'mcp-publisher_linux_amd64.tar.gz$' registry_1.8.1_checksums.txt | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
